apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tinysystems-operator.clusterScopedName" . }}-manager-role
  labels:
  {{- include "tinysystems-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
{{- if .Values.rbac.enableKubernetesResourceAccess }}
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
- apiGroups:
  - operator.tinysystems.io
  resources:
  - tinycomponents
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - operator.tinysystems.io
  resources:
  - tinycomponents/finalizers
  verbs:
  - update
- apiGroups:
  - operator.tinysystems.io
  resources:
  - tinycomponents/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - operator.tinysystems.io
  resources:
  - tinymodules
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.tinysystems.io
  resources:
  - tinymodules/finalizers
  verbs:
  - update
- apiGroups:
  - operator.tinysystems.io
  resources:
  - tinymodules/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - operator.tinysystems.io
  resources:
  - tinynodes
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.tinysystems.io
  resources:
  - tinynodes/finalizers
  verbs:
  - update
- apiGroups:
  - operator.tinysystems.io
  resources:
  - tinynodes/status
  verbs:
  - get
  - patch
  - update
{{- with .Values.rbac.extraRules }}
{{- toYaml . | nindent 0 }}
{{- end }}
---
{{- with .Values.rbac.extraNamespacedRules }}
# Rules a module needs only inside its own namespace.
#
# extraRules above land in a ClusterRole, because a module that lists pods is
# expected to list them wherever they run. Secrets are the opposite: a rule
# written for one namespace became a grant over every namespace in the cluster,
# kube-system included — which is how a component meant to read one registry
# credential could read all of them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tinysystems-operator.fullname" $ }}-extra
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: rbac
  {{- include "tinysystems-operator.labels" $ | nindent 4 }}
rules:
{{- toYaml . | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tinysystems-operator.fullname" $ }}-extra
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: rbac
  {{- include "tinysystems-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ include "tinysystems-operator.fullname" $ }}-extra'
subjects:
- kind: ServiceAccount
  name: '{{ include "tinysystems-operator.fullname" $ }}-controller-manager'
  namespace: '{{ $.Release.Namespace }}'
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tinysystems-operator.clusterScopedName" . }}-manager-rolebinding
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: operator
    app.kubernetes.io/part-of: operator
  {{- include "tinysystems-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "tinysystems-operator.clusterScopedName" . }}-manager-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "tinysystems-operator.fullname" . }}-controller-manager'
  namespace: '{{ .Release.Namespace }}'